version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: clawdeploy
      POSTGRES_PASSWORD: clawdeploy
      POSTGRES_DB: clawdeploy
    ports:
      - "5432:5432"
    volumes:
      - clawdeploy_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  clawdeploy_pg:
